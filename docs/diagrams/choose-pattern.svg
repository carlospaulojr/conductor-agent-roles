<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 620" width="830" height="620" role="img" aria-label="Flowchart for choosing a pattern: single agent, lanes, Best of N, council of models or a single Developer, then review">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; text-anchor: middle; }
    .t { font-size: 15px; font-weight: 600; }
    .q { font-size: 13.5px; font-weight: 500; }
    .s { font-size: 12.5px; fill: #59636e; }
    .lbl { font-size: 12px; fill: #59636e; font-weight: 600; }
    .start { text-anchor: start; }
    .ln { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .ah { fill: #8c959f; }
    rect { stroke-width: 1.5; }
    .qb { fill: #ffffff; stroke: #59636e; }
    .own { fill: #f6f8fa; stroke: #8c959f; }
    .sup { fill: #fbefff; stroke: #8250df; }
    .dev { fill: #ddf4ff; stroke: #0969da; }
    .rev { fill: #fff1e5; stroke: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .s, .lbl { fill: #9198a1; }
      .ln { stroke: #656c76; }
      .ah { fill: #656c76; }
      .qb { fill: #0d1117; stroke: #9198a1; }
      .own { fill: #151b23; stroke: #656c76; }
      .sup { fill: #2a1f47; stroke: #a371f7; }
      .dev { fill: #0c2d4f; stroke: #4493f8; }
      .rev { fill: #3d2410; stroke: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
  </defs>

  <rect x="190" y="14" width="120" height="34" rx="17" class="own"/>
  <text x="250" y="36" class="t">New task</text>
  <line x1="250" y1="48" x2="250" y2="74" class="ln" marker-end="url(#a)"/>

  <!-- Q1 -->
  <rect x="40" y="76" width="420" height="50" rx="8" class="qb"/>
  <text x="250" y="106" class="q">Did you ask for roles, delegation or parallel work?</text>
  <line x1="460" y1="101" x2="538" y2="101" class="ln" marker-end="url(#a)"/>
  <text x="499" y="94" class="lbl">no</text>
  <rect x="540" y="76" width="260" height="50" rx="10" class="own"/>
  <text x="670" y="97" class="t">Single agent</text>
  <text x="670" y="116" class="s">work normally, no workflow</text>
  <line x1="250" y1="126" x2="250" y2="164" class="ln" marker-end="url(#a)"/>
  <text x="260" y="150" class="lbl start">yes</text>

  <!-- Q2 -->
  <rect x="40" y="166" width="420" height="50" rx="8" class="qb"/>
  <text x="250" y="196" class="q">Splits into independent parts with clean file boundaries?</text>
  <line x1="460" y1="191" x2="538" y2="191" class="ln" marker-end="url(#a)"/>
  <text x="499" y="184" class="lbl">yes</text>
  <rect x="540" y="166" width="260" height="50" rx="10" class="dev"/>
  <text x="670" y="187" class="t">Lanes</text>
  <text x="670" y="206" class="s">one owner per path, then integrate</text>
  <line x1="250" y1="216" x2="250" y2="254" class="ln" marker-end="url(#a)"/>
  <text x="260" y="240" class="lbl start">no</text>

  <!-- Q3 -->
  <rect x="40" y="256" width="420" height="50" rx="8" class="qb"/>
  <text x="250" y="286" class="q">Is there an objective, automatic verifier (tests, eval)?</text>
  <line x1="460" y1="281" x2="538" y2="281" class="ln" marker-end="url(#a)"/>
  <text x="499" y="274" class="lbl">yes</text>
  <rect x="540" y="256" width="260" height="50" rx="10" class="dev"/>
  <text x="670" y="277" class="t">Best of N</text>
  <text x="670" y="296" class="s">if worth N tries; else one Developer</text>
  <line x1="250" y1="306" x2="250" y2="344" class="ln" marker-end="url(#a)"/>
  <text x="260" y="330" class="lbl start">no</text>

  <!-- Q4 -->
  <rect x="40" y="346" width="420" height="50" rx="8" class="qb"/>
  <text x="250" y="376" class="q">Is it a judgment call (architecture, design, naming)?</text>
  <line x1="460" y1="371" x2="538" y2="371" class="ln" marker-end="url(#a)"/>
  <text x="499" y="364" class="lbl">yes</text>
  <rect x="540" y="346" width="260" height="50" rx="10" class="sup"/>
  <text x="670" y="367" class="t">Council of models</text>
  <text x="670" y="386" class="s">blind-scored proposals, then merge</text>
  <line x1="250" y1="396" x2="250" y2="434" class="ln" marker-end="url(#a)"/>
  <text x="260" y="420" class="lbl start">no</text>

  <!-- Single Developer -->
  <rect x="40" y="436" width="420" height="58" rx="10" class="dev"/>
  <text x="250" y="460" class="t">Single Developer</text>
  <text x="250" y="481" class="s">also for coupled, step-by-step work and small bugs</text>
  <line x1="250" y1="494" x2="250" y2="536" class="ln" marker-end="url(#a)"/>

  <!-- collector from right-side outcomes -->
  <path d="M800,191 H814 M800,281 H814 M800,371 H814 M814,191 V571 H802" class="ln dash" marker-end="url(#a)"/>

  <!-- Review band -->
  <rect x="40" y="538" width="760" height="66" rx="10" class="rev"/>
  <text x="420" y="565" class="t">Then review every code change</text>
  <text x="420" y="588" class="s">reviewer team for relevant changes · one reviewer or tests for small, local ones</text>
</svg>
