<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 470" width="830" height="470" role="img" aria-label="Model ladder: OpenAI and Claude rungs side by side, with the profiles that use each rung">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; text-anchor: middle; }
    .h { font-size: 16px; font-weight: 700; }
    .t { font-size: 15px; font-weight: 600; }
    .rl { font-size: 13.5px; font-weight: 600; text-anchor: start; }
    .s { font-size: 12.5px; fill: #59636e; }
    .p { font-size: 12.5px; text-anchor: start; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lbl { font-size: 12px; fill: #59636e; text-anchor: start; }
    .start { text-anchor: start; }
    .sep { stroke: #d1d9e0; stroke-width: 1; }
    rect { stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .own { fill: #f6f8fa; stroke: #8c959f; }
    .sup { fill: #fbefff; stroke: #8250df; }
    .dev { fill: #ddf4ff; stroke: #0969da; }
    .ops { fill: #dafbe1; stroke: #1a7f37; }
    .rev { fill: #fff1e5; stroke: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .s, .lbl { fill: #9198a1; }
      .sep { stroke: #3d444d; }
      .own { fill: #151b23; stroke: #656c76; }
      .sup { fill: #2a1f47; stroke: #a371f7; }
      .dev { fill: #0c2d4f; stroke: #4493f8; }
      .ops { fill: #0f3020; stroke: #3fb950; }
      .rev { fill: #3d2410; stroke: #f0883e; }
    }
  </style>

  <text x="240" y="40" class="h">OpenAI (Codex)</text>
  <text x="420" y="40" class="h">Claude</text>
  <text x="530" y="40" class="h start">Profiles</text>

  <!-- Top -->
  <text x="20" y="97" class="rl">Top</text>
  <rect x="160" y="64" width="160" height="56" rx="10" class="rev"/>
  <text x="240" y="88" class="t">Astra</text>
  <text x="240" y="107" class="s">$8 / $40</text>
  <rect x="340" y="64" width="160" height="56" rx="10" class="rev"/>
  <text x="420" y="88" class="t">Fable</text>
  <text x="420" y="107" class="s">$8 / $40</text>
  <text x="530" y="88" class="p">developer_critical</text>
  <text x="530" y="107" class="p">supervisor_advanced / _critical</text>
  <line x1="20" y1="127" x2="810" y2="127" class="sep"/>

  <!-- First escalation -->
  <text x="20" y="167" class="rl">First escalation</text>
  <rect x="160" y="134" width="160" height="56" rx="10" class="dev dash"/>
  <text x="240" y="158" class="t">Sol, high effort</text>
  <text x="240" y="177" class="s">more reasoning effort</text>
  <rect x="340" y="134" width="160" height="56" rx="10" class="sup"/>
  <text x="420" y="158" class="t">Opus</text>
  <text x="420" y="177" class="s">$4 / $20</text>
  <text x="530" y="158" class="p">developer_high</text>
  <text x="530" y="177" class="p">supervisor_review</text>
  <line x1="20" y1="197" x2="810" y2="197" class="sep"/>

  <!-- Default -->
  <text x="20" y="237" class="rl">Default</text>
  <rect x="160" y="204" width="160" height="56" rx="10" class="dev"/>
  <text x="240" y="228" class="t">Sol</text>
  <text x="240" y="247" class="s">$2 / $10</text>
  <rect x="340" y="204" width="160" height="56" rx="10" class="dev"/>
  <text x="420" y="228" class="t">Sonnet</text>
  <text x="420" y="247" class="s">$2 / $10</text>
  <text x="530" y="228" class="p">Supervisor · developer</text>
  <text x="530" y="247" class="p">developer_low · operator_complex</text>
  <line x1="20" y1="267" x2="810" y2="267" class="sep"/>

  <!-- Unused -->
  <text x="20" y="307" class="rl">Not used</text>
  <rect x="160" y="274" width="160" height="56" rx="10" class="own dash"/>
  <text x="240" y="298" class="t">Terra</text>
  <text x="240" y="317" class="s">$1 / $5</text>
  <rect x="340" y="274" width="160" height="56" rx="10" class="own dash"/>
  <text x="420" y="307" class="s">no counterpart</text>
  <text x="530" y="307" class="lbl">between economy and default; skipped</text>
  <line x1="20" y1="337" x2="810" y2="337" class="sep"/>

  <!-- Economy -->
  <text x="20" y="377" class="rl">Economy</text>
  <rect x="160" y="344" width="160" height="56" rx="10" class="ops"/>
  <text x="240" y="368" class="t">Luna</text>
  <text x="240" y="387" class="s">$0.10 / $0.50</text>
  <rect x="340" y="344" width="160" height="56" rx="10" class="ops"/>
  <text x="420" y="368" class="t">Haiku</text>
  <text x="420" y="387" class="s">$0.10 / $0.50</text>
  <text x="530" y="368" class="p">operator</text>
  <text x="530" y="387" class="p">operator_medium</text>

  <text x="20" y="438" class="lbl">Price per 1M tokens (input / output), November 2026. Claude has a middle rung (Opus) that OpenAI does not.</text>
  <text x="20" y="458" class="lbl">Models change fast: adjust the model fields to what your account offers and keep the table in SKILL.md in sync.</text>
</svg>
